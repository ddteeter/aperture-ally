[project]
name = "aperture-ally"
version = "0.1.0"
description = "Local-first photography teaching loop: tethered capture, grounded coaching, spoken feedback, retake comparison."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "watchdog>=5.0",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pillow>=11.0",
  "rawpy>=0.23",
  "openai>=1.60",
  "google-genai>=1.0",
  "sounddevice>=0.5",
  "pynput>=1.7.7; sys_platform == 'darwin'",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "anthropic>=1.0",
  "hidapi>=0.15.0",
  "gphoto2>=2.6.4 ; sys_platform == 'darwin'",
]

[project.scripts]
aperture-ally = "aperture_ally.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aperture_ally"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: calls paid provider APIs (explicitly invoked only)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["E501", "RUF005", "ASYNC109", "SIM102", "B008", "SIM105", "RUF001", "RUF002", "RUF003", "RUF012", "ASYNC230", "ASYNC240", "E731"]
